name: BankSecure API Guard Security Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-gate:
    name: Run API Security Gate & Functional Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt

      - name: Start Backend Server & Run Security Suite
        run: |
          python backend/app/seed.py
          python -c "
          from app.database import SessionLocal
          from app.services.test_engine import TestEngine
          db = SessionLocal()
          test_run = TestEngine.run_suite(db=db, execution_type='REGRESSION', executed_by='CI_CD_BOT')
          print(f'CI/CD Gate Check: Security Score = {test_run.security_score}/100, Critical Findings = {test_run.critical_count}')
          if test_run.critical_count > 0:
              print('BUILD FAILED: Critical API vulnerabilities detected!')
              exit(1)
          print('BUILD PASSED: Security Gate Cleared.')
          "
